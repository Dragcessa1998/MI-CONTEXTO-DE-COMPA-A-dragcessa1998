name: nexova

services:
  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    environment:
      PLATFORM_API_INTERNAL_URL: ${PLATFORM_API_INTERNAL_URL}
      NEXT_PUBLIC_PLATFORM_API_URL: ${NEXT_PUBLIC_PLATFORM_API_URL}
      NEXT_PUBLIC_SUPPLIERS_API_URL: ${NEXT_PUBLIC_SUPPLIERS_API_URL}
      NEXT_PUBLIC_PLATFORM_WS_URL: ${NEXT_PUBLIC_PLATFORM_WS_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/talent-api}
      TALENT_API_INTERNAL_URL: ${TALENT_API_INTERNAL_URL:-http://talent-api:4000}
    ports:
      - "127.0.0.1:${WEBSITE_PORT}:3000"
      - "127.0.0.1:${BACKOFFICE_PORT}:3001"
    depends_on:
      backend:
        condition: service_healthy
      talent-api:
        condition: service_healthy
    networks:
      - nexova-dev

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in the root .env file}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Define OPENAI_API_KEY in the root .env file}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_GENERATION_MODEL: ${OPENAI_GENERATION_MODEL:-gpt-5.6-luna}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.35}
      QDRANT_URL: http://qdrant:6333
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,backend,testserver}
    volumes:
      - platform_data:/workspace/data
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - nexova-dev

  talent-api:
    build:
      context: .
      dockerfile: services/talent-api/Dockerfile
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in the root .env file}
      TALENT_API_ALLOWED_ROLES: ${TALENT_API_ALLOWED_ROLES:-manager,admin}
      TALENT_API_CORS_ALLOWED_ORIGINS: ${TALENT_API_CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - nexova-dev

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexova-dev

networks:
  nexova-dev:
    name: nexova-dev

volumes:
  platform_data:
  qdrant_data:
