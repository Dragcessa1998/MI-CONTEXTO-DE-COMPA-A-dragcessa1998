[project]
name = "nexova-sales-forecasting"
version = "1.0.0"
description = "Reproducible Random Forest sales forecast for Nexova"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
