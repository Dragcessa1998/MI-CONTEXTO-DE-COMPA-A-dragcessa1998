[project]
name = "nexova-supplier-api"
version = "2.0.0"
description = "Supplier Directory de Nexova protegido con JWT, usuarios y perfiles en TinyDB"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2",
    "fastapi>=0.115",
    "libpass[bcrypt]>=1.9",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
    "tinydb>=4.8",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "database", "seed"]
packages = ["routes"]
