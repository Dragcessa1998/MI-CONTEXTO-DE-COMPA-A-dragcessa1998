[project]
name = "nexova-supplier-api"
version = "3.0.0"
description = "API operativa de Nexova: TinyDB para identidad y SQLModel para inventario"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2",
    "fastapi>=0.115",
    "libpass[bcrypt]>=1.9",
    "nexova-shared",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
    "tinydb>=4.8",
    "pydantic>=2.9",
    "psycopg2-binary>=2.9",
    "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[project.scripts]
seed = "seed:main"
seed-inventory = "inventory_seed:main"

[tool.uv.sources]
nexova-shared = { path = "../../packages/shared", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "database", "seed", "inventory_models", "schemas", "inventory_seed"]
packages = ["routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["auth_service", "security", "routes.auth", "routes.users"]

[tool.coverage.report]
show_missing = true
skip_covered = true
