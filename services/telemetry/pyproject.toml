[project]
name = "nexova-telemetry"
version = "1.0.0"
description = "Pipeline analítico de telemetría operacional de Nexova"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["telemetry"]
package-dir = { telemetry = "." }
